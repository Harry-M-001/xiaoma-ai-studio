name: CI

# 每次推 main / 提 PR 都跑一遍：全新空库能建表、后端全量测试、前端能构建。
# 发布（tag）相关的打包与上传不在 CI 里做，仍由 backend/tools/release.py 在本地跑。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # 「第一次启动」这条路径必须单独验：全新空目录里从零 upgrade head 建出全部表。
      # 只在已有数据库上跑测试会漏掉迁移断链的问题。
      - name: Migrate a fresh empty data dir
        env:
          DATA_DIR: ${{ runner.temp }}/fresh-data
        run: |
          python -c "import asyncio; from app.migrations import run_migrations; asyncio.run(run_migrations())"
          python -c "import sqlite3, os; c = sqlite3.connect(os.path.join(os.environ['DATA_DIR'], 'xiaoma.db')); print(sorted(r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")))"

      # 字幕 / 补帧 / 超分这些用例会真跑 ffmpeg；Ubuntu 镜像默认不带，
      # 不装的话它们会整体失败（不是用例写错）。Ubuntu 的 ffmpeg 带 libass。
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Tests
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
